<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin:0; height:100%; background:#111; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; margin:0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ================= SETTINGS (edit these) =================
// Put your own photos next to this file and type their names here.
// Leave '' to use the built-in drawn graphics.
const IMAGE_FILES = {
  player: '',   // your car photo (top-down, facing up, ideally PNG with transparent bg)
  enemy:  '',   // enemy car photo
  road:   '',   // road texture (tileable vertically)
  bg:     ''    // background texture for the sides (tileable vertically)
};
const LANES = 3;
const START_SPEED = 4.5;   // starting speed
const MAX_EXTRA_SPEED = 8; // how much faster it gets over time
const MIN_ROW_GAP = 260;   // closest distance between enemy rows (smaller = harder)
// =========================================================

const c = document.getElementById('c'), ctx = c.getContext('2d');
const IMG = {};
for (const k in IMAGE_FILES) {
  if (IMAGE_FILES[k]) { const i = new Image(); i.onload = () => IMG[k] = i; i.src = IMAGE_FILES[k]; }
}

let W, H, roadW, roadX, LW, CW, CH, unit;
const player = { lane: 1, x: 0, y: 0 };
let enemies = [], coins = [], parts = [];
let state = 'menu', speed = 0, dist = 0, elapsed = 0, scroll = 0;
let coinCount = 0, spawnLeft = 0, lastFree = 1, shake = 0, overAt = 0, score = 0;
let best = 0;
try { best = +localStorage.getItem('best') || 0; } catch (e) {}

const laneX = l => roadX + LW * l + LW / 2;

function layout() {
  const dpr = window.devicePixelRatio || 1;
  W = Math.min(innerWidth, 480); H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  roadW = W * 0.86; roadX = (W - roadW) / 2; LW = roadW / LANES;
  CW = LW * 0.5; CH = CW * 1.8; unit = H / 700;
  player.y = H - CH - 50 * unit;
  player.x = laneX(player.lane);
}

// ---------- sound ----------
let AC;
function beep(f, d, type = 'square', v = 0.05) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.stop(AC.currentTime + d);
  } catch (e) {}
}

// ---------- input ----------
function start() {
  enemies = []; coins = []; parts = [];
  speed = START_SPEED * unit; dist = 0; elapsed = 0; coinCount = 0; score = 0;
  spawnLeft = 200 * unit; lastFree = 1; player.lane = 1; shake = 0;
  state = 'play'; beep(520, 0.12);
}
function action(dir) {
  if (state === 'menu') return start();
  if (state === 'over') { if (performance.now() - overAt > 600) start(); return; }
  player.lane = Math.max(0, Math.min(LANES - 1, player.lane + dir));
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') action(-1);
  else if (e.key === 'ArrowRight' || e.key === 'd') action(1);
  else if (e.key === ' ' || e.key === 'Enter') action(0);
});
c.addEventListener('pointerdown', e => {
  const x = e.clientX - c.getBoundingClientRect().left;
  action(x < W / 2 ? -1 : 1);
});
addEventListener('resize', layout);

// ---------- spawning ----------
const COLORS = ['#e74c3c', '#f39c12', '#9b59b6', '#3498db', '#ecf0f1', '#e67e22'];
function spawnRow() {
  // free lane can only shift by 1 so the gap is always reachable
  const opts = [lastFree - 1, lastFree, lastFree + 1].filter(l => l >= 0 && l < LANES);
  const free = opts[Math.floor(Math.random() * opts.length)];
  lastFree = free;
  const p = Math.min(0.5 + elapsed / 6000, 0.95);
  let n = 0;
  for (let l = 0; l < LANES; l++) {
    if (l !== free && Math.random() < p) {
      enemies.push({ lane: l, y: -CH, color: COLORS[Math.floor(Math.random() * COLORS.length)] });
      n++;
    }
  }
  if (!n) {
    const others = [...Array(LANES).keys()].filter(l => l !== free);
    enemies.push({ lane: others[Math.floor(Math.random() * others.length)], y: -CH, color: COLORS[0] });
  }
  if (Math.random() < 0.45) {
    const gap = Math.max(MIN_ROW_GAP, 380 - elapsed / 10) * unit;
    coins.push({ lane: Math.floor(Math.random() * LANES), y: -CH - gap / 2 });
  }
}

function burst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = Math.random() * power;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, color });
  }
}

// ---------- update ----------
function update(dt) {
  scroll += (state === 'play' ? speed : state === 'menu' ? 2 : 0) * dt;
  player.x += (laneX(player.lane) - player.x) * Math.min(1, 0.25 * dt);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
  parts = parts.filter(p => p.life > 0);
  shake *= 0.9;

  if (state !== 'play') return;
  elapsed += dt;
  speed = (START_SPEED + Math.min(elapsed / 400, MAX_EXTRA_SPEED)) * unit;
  dist += speed * dt;

  spawnLeft -= speed * dt;
  if (spawnLeft <= 0) {
    spawnRow();
    spawnLeft = Math.max(MIN_ROW_GAP, 380 - elapsed / 10) * unit;
  }

  enemies.forEach(e => e.y += speed * dt);
  coins.forEach(k => k.y += speed * dt);
  enemies = enemies.filter(e => e.y < H + CH);
  coins = coins.filter(k => k.y < H + 40);

  for (const e of enemies) {
    if (Math.abs(laneX(e.lane) - player.x) < CW * 0.8 && Math.abs(e.y - player.y) < CH * 0.88) {
      state = 'over'; overAt = performance.now(); shake = 14;
      burst(player.x, player.y + CH / 2, '#ffb300', 30, 7);
      burst(player.x, player.y + CH / 2, '#ff5252', 20, 5);
      beep(110, 0.5, 'sawtooth', 0.12);
      if (score > best) { best = score; try { localStorage.setItem('best', best); } catch (e) {} }
      return;
    }
  }
  coins = coins.filter(k => {
    const hit = Math.abs(laneX(k.lane) - player.x) < CW * 0.7 && Math.abs(k.y - (player.y + CH / 2)) < CH * 0.6;
    if (hit) { coinCount++; burst(laneX(k.lane), k.y, '#ffd700', 10, 4); beep(880, 0.1, 'triangle', 0.08); }
    return !hit;
  });
  score = Math.floor(dist / unit / 30) + coinCount * 25;
}

// ---------- drawing ----------
function tile(img, x, w, off) {
  const ih = img.height * w / img.width;
  for (let y = (off % ih) - ih; y < H; y += ih) ctx.drawImage(img, x, y, w, ih + 1);
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function drawRoad() {
  if (IMG.bg) tile(IMG.bg, 0, W, scroll * 0.6);
  else {
    ctx.fillStyle = '#2d5a27'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#336b2c';
    for (let y = (scroll * 0.6 % 160) - 160; y < H; y += 160) ctx.fillRect(0, y, W, 80);
  }
  if (IMG.road) { tile(IMG.road, roadX, roadW, scroll); return; }
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(roadX, 0, roadW, H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(roadX, 0, 4, H); ctx.fillRect(roadX + roadW - 4, 0, 4, H);
  for (let i = 1; i < LANES; i++)
    for (let y = (scroll % 70) - 70; y < H; y += 70)
      ctx.fillRect(roadX + i * LW - 2, y, 4, 35);
}
function drawCar(img, cx, y, color, rot = 0) {
  ctx.save();
  ctx.translate(cx, y + CH / 2); ctx.rotate(rot); ctx.translate(-cx, -(y + CH / 2));
  const l = cx - CW / 2;
  if (img) ctx.drawImage(img, l, y, CW, CH);
  else {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(l + 3, y + 6, CW, CH, 8);
    ctx.fillStyle = color; rr(l, y, CW, CH, 8);
    ctx.fillStyle = '#9cf'; rr(l + CW * 0.15, y + CH * 0.2, CW * 0.7, CH * 0.2, 4);
    rr(l + CW * 0.18, y + CH * 0.62, CW * 0.64, CH * 0.14, 3);
    ctx.fillStyle = '#ffeb3b'; ctx.fillRect(l + 3, y, CW * 0.2, 4); ctx.fillRect(l + CW - 3 - CW * 0.2, y, CW * 0.2, 4);
  }
  ctx.restore();
}
function drawCoin(x, y) {
  const w = Math.abs(Math.cos(performance.now() / 200)) * 11 + 3;
  ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.ellipse(x, y, w, 12, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.ellipse(x - w * 0.3, y - 3, w * 0.3, 4, 0, 0, 6.28); ctx.fill();
}
function text(t, x, y, size, align = 'center') {
  ctx.font = 'bold ' + size + 'px sans-serif'; ctx.textAlign = align;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(t, x + 2, y + 2);
  ctx.fillStyle = '#fff'; ctx.fillText(t, x, y);
}
function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawRoad();
  coins.forEach(k => drawCoin(laneX(k.lane), k.y));
  enemies.forEach(e => drawCar(IMG.enemy, laneX(e.lane), e.y, e.color));
  if (state !== 'over') drawCar(IMG.player, player.x, player.y, '#2ecc71', (player.x - laneX(player.lane)) / LW * 0.5);
  parts.forEach(p => { ctx.globalAlpha = p.life / 30; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 5, 5); });
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'play' || state === 'over') {
    text('Score: ' + score, 12, 30, 20, 'left');
    text('Best: ' + best, W - 12, 30, 16, 'right');
    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(20, 52, 7, 0, 6.28); ctx.fill();
    text('x ' + coinCount, 34, 58, 16, 'left');
  }
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    text('ROAD RUSH', W / 2, H / 2 - 30, 40);
    text('Tap left / right to change lane', W / 2, H / 2 + 10, 16);
    text('Collect coins, dodge cars', W / 2, H / 2 + 34, 16);
    text('TAP TO START', W / 2, H / 2 + 80, 22);
    if (best) text('Best: ' + best, W / 2, H / 2 + 112, 16);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    text('CRASH!', W / 2, H / 2 - 30, 44);
    text('Score: ' + score + (score >= best ? '  (new best!)' : ''), W / 2, H / 2 + 10, 20);
    text('Best: ' + best, W / 2, H / 2 + 38, 16);
    text('Tap to restart', W / 2, H / 2 + 80, 20);
  }
}

// ---------- main loop ----------
let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 16.67 || 1, 3); last = t;
  update(dt); draw();
  requestAnimationFrame(loop);
}
layout();
requestAnimationFrame(loop);
</script>
</body>
</html>
